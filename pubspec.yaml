name: fivefold_chess
description: A cross-platform chess app featuring five variants — Classic, Long, Silent, Reverse, and Barbarian Chess.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Firebase (online multiplayer)
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  cloud_functions: ^4.7.5
  firebase_remote_config: ^4.4.5

  # AdMob
  google_mobile_ads: ^5.1.0

  # iOS App Tracking Transparency prompt (no-op on Android).
  app_tracking_transparency: ^2.0.6

  # Short-lived SFX playback for chess move/capture/check sounds.
  audioplayers: ^6.1.0

  # Google Fonts on demand (Cinzel for headlines, Inter for body).
  # Fonts are fetched from Google's CDN on first use and cached locally.
  google_fonts: ^6.2.1

  # Chess AI (Classic mode)
  stockfish: ^1.6.0

  # Utils
  collection: ^1.18.0
  meta: ^1.12.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  # Generates platform-specific launcher icons from a source PNG.
  flutter_launcher_icons: ^0.13.1

  # Generates platform-specific splash screens from a source PNG.
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pieces/
    - assets/fivefold_chess_icon.png
    - assets/fivefold_chess_logo.png
    - assets/white_piece_background.jpg
    - assets/black_piece_background.jpg
    - assets/sounds/

# ------------------------------------------------------------------
# App icon configuration. After editing this section, run:
#   flutter pub get
#   dart run flutter_launcher_icons
# (One-time per source-image change; commit the generated files.)
# ------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/fivefold_chess_icon.png"
  remove_alpha_ios: true
  # Adaptive Android icon: render the icon onto a solid background so it
  # looks correct on circular and rounded-square launcher shapes.
  adaptive_icon_background: "#1F3864"
  adaptive_icon_foreground: "assets/fivefold_chess_icon.png"

# ------------------------------------------------------------------
# Splash screen configuration. After editing this section, run:
#   flutter pub get
#   dart run flutter_native_splash:create
# This generates a native splash that's shown before the Flutter
# engine boots, so first frame doesn't flash a blank white screen.
# ------------------------------------------------------------------
flutter_native_splash:
  color: "#1F3864"
  image: "assets/fivefold_chess_icon.png"
  android_12:
    color: "#1F3864"
    image: "assets/fivefold_chess_icon.png"
  android: true
  ios: true
